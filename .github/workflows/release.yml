name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Releases from main are numbered v<BASE_VERSION>.<run number>, for example v1.0.12.
  # Raise this (for example to "1.1" or "2.0") for a bigger update.
  BASE_VERSION: "1.0"

jobs:
  version:
    name: Choose version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="v${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          else
            tag="dev-${GITHUB_SHA::7}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Version: ${tag}"

  build:
    name: Build (${{ matrix.label }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-15
            label: macOS Apple Silicon
          # GitHub's last Intel Mac runner, available until August 2027.
          - os: macos-15-intel
            label: macOS Intel
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.tag }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check the source runs
        run: python main.py --self-test

      - name: Build
        run: python build.py "$VERSION"

      - name: Check the packaged app runs (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: '"dist/GBIF Herbaria Pipeline.app/Contents/MacOS/GBIF Herbaria Pipeline" --self-test'

      - name: Check the packaged app runs (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = "dist\GBIF Herbaria Pipeline\GBIF Herbaria Pipeline.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          make_latest: ${{ !contains(needs.version.outputs.tag, '-') }}