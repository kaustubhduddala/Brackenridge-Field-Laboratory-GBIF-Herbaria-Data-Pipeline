name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Releases from main are numbered v<BASE_VERSION>.<run number>, for example v1.0.12.
  # Raise this (for example to "1.1" or "2.0") for a bigger update.
  BASE_VERSION: "1.0"

jobs:
  version:
    name: Choose version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="v${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          else
            tag="dev-${GITHUB_SHA::7}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Version: ${tag}"

  build:
    name: Build (${{ matrix.label }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-15
            label: macOS Apple Silicon
          # GitHub's last Intel Mac runner, available until August 2027.
          - os: macos-15-intel
            label: macOS Intel
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.tag }}
      # Sign only builds that are released, and only once the signing secrets have been added.
      SIGN_MACOS: ${{ github.event_name == 'push' && secrets.MACOS_CERTIFICATE != '' }}
      SIGN_WINDOWS: ${{ github.event_name == 'push' && secrets.AZURE_CLIENT_ID != '' }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check the source runs
        run: python main.py --self-test

      - name: Import the Apple signing certificate
        if: runner.os == 'macOS' && env.SIGN_MACOS == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep "Developer ID Application" | head -n 1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$identity" ]; then
            echo "No Developer ID Application certificate found in MACOS_CERTIFICATE" >&2
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Signing as: $identity"

      - name: Build (and on macOS sign and notarize)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python build.py "$VERSION" --no-archive

      - name: Sign the Windows app
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\GBIF Herbaria Pipeline
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the Windows signature
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature "dist\GBIF Herbaria Pipeline\GBIF Herbaria Pipeline.exe"
          Write-Output "Signed by: $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne "Valid") { throw "Signature status is $($signature.Status)" }

      - name: Check the packaged app runs (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: '"dist/GBIF Herbaria Pipeline.app/Contents/MacOS/GBIF Herbaria Pipeline" --self-test'

      - name: Check the packaged app runs (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = "dist\GBIF Herbaria Pipeline\GBIF Herbaria Pipeline.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Package
        run: python build.py "$VERSION" --archive-only

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          make_latest: ${{ !contains(needs.version.outputs.tag, '-') }}